<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cafe Admin Login</title>


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f7f9;

            color: #27343b;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            width: 100%;

            max-width: 410px;

            background: #ffffff;

            border:
                1px solid #dfe5e8;

            border-radius: 10px;

            padding: 30px;

            box-shadow:
                0 8px 25px
                rgba(28,48,58,0.06);
        }


        /* =========================================
           BRAND
        ========================================= */

        .brand-icon {

            width: 52px;
            height: 52px;

            margin: 0 auto 16px;

            border-radius: 9px;

            background: #17384d;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 21px;
        }


        h1 {

            margin: 0;

            text-align: center;

            color: #26343b;

            font-size: 22px;

            font-weight: 600;
        }


        .subtitle {

            margin:
                6px 0 25px;

            text-align: center;

            color: #87939a;

            font-size: 11px;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 18px;

            padding: 10px 12px;

            border:
                1px solid #f1caca;

            border-radius: 6px;

            background: #fff5f5;

            color: #b84242;

            font-size: 10px;
        }


        .error i {

            font-size: 13px;
        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 17px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #46565e;

            font-size: 10px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 12px;

            top: 50%;

            transform: translateY(-50%);

            color: #8a989f;

            font-size: 13px;

            pointer-events: none;
        }


        input {

            width: 100%;

            height: 41px;

            padding:
                0 12px 0 36px;

            border:
                1px solid #d6dfe3;

            border-radius: 6px;

            background: #ffffff;

            color: #34454d;

            font-family: inherit;

            font-size: 11px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        input::placeholder {

            color: #a3adb2;
        }


        input:focus {

            border-color: #315b72;

            box-shadow:
                0 0 0 3px
                rgba(49,91,114,0.08);
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-btn {

            width: 100%;

            height: 40px;

            border: none;

            padding: 0;

            margin-top: 5px;

            border-radius: 6px;

            background: #315b72;

            color: #ffffff;

            font-family: inherit;

            font-size: 10px;

            font-weight: 600;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            transition:
                background 0.2s ease;
        }


        .login-btn:hover {

            background: #25495d;
        }


        .login-btn i {

            font-size: 12px;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            margin-top: 22px;

            padding-top: 16px;

            border-top:
                1px solid #edf0f1;

            text-align: center;
        }


        .footer-text {

            margin: 0;

            color: #9aa4a9;

            font-size: 9px;
        }


        .footer-brand {

            margin-top: 4px;

            color: #315b72;

            font-size: 9px;

            font-weight: 600;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            body {

                padding: 15px;
            }


            .login-card {

                padding: 25px 20px;

                border-radius: 9px;
            }


            .brand-icon {

                width: 48px;
                height: 48px;

                font-size: 19px;
            }


            h1 {

                font-size: 20px;
            }


            .subtitle {

                margin-bottom: 22px;
            }

        }

    </style>

</head>


<body>


    <div class="login-card">


        <!-- BRAND ICON -->

        <div class="brand-icon">

            <i class="bi bi-cup-hot-fill"></i>

        </div>


        <!-- TITLE -->

        <h1>
            Cafe Admin
        </h1>


        <p class="subtitle">
            Login to manage your cafe
        </p>


        <!-- ERROR -->

        {% if error %}

            <div class="error">

                <i class="bi bi-exclamation-circle-fill"></i>

                <span>
                    {{ error }}
                </span>

            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-person input-icon"></i>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-wrapper">

                    <i class="bi bi-lock input-icon"></i>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>


        </form>


        <!-- FOOTER -->

        <div class="footer">

            <p class="footer-text">
                Secure administration access
            </p>

            <div class="footer-brand">
                Cafe QR Ordering System
            </div>

        </div>


    </div>


</body>

</html>
