<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Status | Cafe Delights</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #f7faf8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #263238;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;
        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .status-card {

            width: 100%;

            max-width: 500px;

            background: #ffffff;

            border:
                1px solid #e1e9e5;

            border-radius: 16px;

            padding:
                28px 23px;

            box-shadow:
                0 8px 28px
                rgba(27, 94, 64, 0.07);
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            text-align: center;

            margin-bottom: 22px;
        }


        .icon {

            width: 60px;

            height: 60px;

            margin:
                0 auto 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e8f7ef;

            color: #15955a;

            border-radius: 50%;

            font-size: 27px;
        }


        h1 {

            margin: 0;

            font-size: 23px;

            font-weight: 700;

            color: #263238;
        }


        .subtitle {

            margin:
                6px 0 0;

            color: #7b8581;

            font-size: 12px;
        }


        /* =========================================
           ORDER INFORMATION
        ========================================= */

        .order-info {

            background: #f8fbf9;

            border:
                1px solid #e3ece7;

            border-radius: 10px;

            padding:
                12px 15px;

            margin-bottom: 20px;
        }


        .info-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 8px 0;

            font-size: 12px;
        }


        .info-row + .info-row {

            border-top:
                1px solid #e8efeb;
        }


        .info-label {

            color: #7b8581;
        }


        .info-value {

            color: #34423c;

            font-weight: 700;

            text-align: right;
        }


        /* =========================================
           CURRENT STATUS
        ========================================= */

        .current-status {

            text-align: center;

            margin-bottom: 25px;
        }


        .status-label {

            color: #7b8581;

            font-size: 11px;

            margin-bottom: 7px;
        }


        .status-value {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 31px;

            padding:
                0 16px;

            border-radius: 20px;

            background: #e8f7ef;

            color: #15955a;

            font-size: 12px;

            font-weight: 700;

            border:
                1px solid #cfe9da;
        }


        /* =========================================
           PROGRESS
        ========================================= */

        .progress {

            position: relative;

            display: flex;

            justify-content: space-between;

            margin:
                25px 2px 8px;
        }


        .progress-line {

            position: absolute;

            top: 15px;

            left: 12%;

            right: 12%;

            height: 3px;

            background: #e2e9e6;

            z-index: 0;

            border-radius: 5px;
        }


        .step {

            position: relative;

            z-index: 1;

            width: 25%;

            text-align: center;
        }


        .circle {

            width: 31px;

            height: 31px;

            margin:
                0 auto 7px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #e1e8e5;

            color: #7b8581;

            font-size: 11px;

            font-weight: 700;

            border:
                3px solid #ffffff;
        }


        .step.active .circle {

            background: #18ad68;

            color: #ffffff;

            box-shadow:
                0 2px 7px
                rgba(24, 173, 104, 0.18);
        }


        .step-name {

            font-size: 10px;

            color: #89928e;

            line-height: 1.3;
        }


        .step.active .step-name {

            color: #15955a;

            font-weight: 700;
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {

            display: block;

            width: 100%;

            margin-top: 28px;

            min-height: 44px;

            padding:
                0 20px;

            background: #18ad68;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            text-decoration: none;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

            box-shadow:
                0 4px 10px
                rgba(24, 173, 104, 0.15);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .back-button:hover {

            background: #13965a;

            color: #ffffff;

            transform: translateY(-1px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            body {

                padding: 14px;
            }


            .status-card {

                padding:
                    25px 17px;

                border-radius: 14px;
            }


            .icon {

                width: 56px;

                height: 56px;

                font-size: 25px;
            }


            h1 {

                font-size: 21px;
            }


            .subtitle {

                font-size: 11px;
            }


            .order-info {

                padding:
                    10px 13px;
            }


            .info-row {

                font-size: 11px;

                padding: 7px 0;
            }


            .progress {

                margin-top: 23px;
            }


            .progress-line {

                top: 14px;
            }


            .circle {

                width: 29px;

                height: 29px;

                font-size: 10px;
            }


            .step-name {

                font-size: 9px;
            }


            .back-button {

                min-height: 42px;

                font-size: 11px;
            }

        }


        @media (max-width: 360px) {

            .status-card {

                padding:
                    23px 14px;
            }


            .step-name {

                font-size: 8px;
            }


            .circle {

                width: 27px;

                height: 27px;
            }


            .progress-line {

                top: 13px;
            }

        }

    </style>

</head>


<body>


    <div class="status-card">


        <!-- =========================================
             HEADER
        ========================================= -->

        <div class="header">


            <div class="icon">
                ☕
            </div>


            <h1>
                Order Status
            </h1>


            <p class="subtitle">
                Track your order from the cafe
            </p>


        </div>


        <!-- =========================================
             ORDER INFORMATION
        ========================================= -->

        <div class="order-info">


            <div class="info-row">


                <span class="info-label">
                    Order Number
                </span>


                <span class="info-value">
                    #{{ order.id }}
                </span>


            </div>


            <div class="info-row">


                <span class="info-label">
                    Table
                </span>


                <span class="info-value">
                    {{ table.table_number }}
                </span>


            </div>


            <div class="info-row">


                <span class="info-label">
                    Total Amount
                </span>


                <span class="info-value">
                    ₹{{ order.total_amount }}
                </span>


            </div>


        </div>


        <!-- =========================================
             CURRENT STATUS
        ========================================= -->

        <div class="current-status">


            <div class="status-label">
                Current Status
            </div>


            <div class="status-value">

                {{ order.get_status_display }}

            </div>


        </div>


        <!-- =========================================
             ORDER PROGRESS
        ========================================= -->

        <div class="progress">


            <div class="progress-line"></div>


            <!-- PENDING -->

            <div
                class="step {% if order.status == 'pending' or order.status == 'preparing' or order.status == 'ready' or order.status == 'completed' %}active{% endif %}"
            >


                <div class="circle">
                    1
                </div>


                <div class="step-name">
                    Pending
                </div>


            </div>


            <!-- PREPARING -->

            <div
                class="step {% if order.status == 'preparing' or order.status == 'ready' or order.status == 'completed' %}active{% endif %}"
            >


                <div class="circle">
                    2
                </div>


                <div class="step-name">
                    Preparing
                </div>


            </div>


            <!-- READY -->

            <div
                class="step {% if order.status == 'ready' or order.status == 'completed' %}active{% endif %}"
            >


                <div class="circle">
                    3
                </div>


                <div class="step-name">
                    Ready
                </div>


            </div>


            <!-- COMPLETED -->

            <div
                class="step {% if order.status == 'completed' %}active{% endif %}"
            >


                <div class="circle">
                    4
                </div>


                <div class="step-name">
                    Completed
                </div>


            </div>


        </div>


        <!-- =========================================
             BACK TO MENU
        ========================================= -->

        <a
            href="{% url 'menu' table.table_number %}"
            class="back-button"
        >
            Back to Menu
        </a>


    </div>


</body>

</html>
