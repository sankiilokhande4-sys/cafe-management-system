<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Placed | Cafe Delights</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #f7faf8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #263238;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;
        }


        /* =========================================
           SUCCESS CARD
        ========================================= */

        .success-card {

            width: 100%;

            max-width: 500px;

            background: #ffffff;

            border:
                1px solid #e1e9e5;

            border-radius: 16px;

            padding:
                32px 23px 27px;

            text-align: center;

            box-shadow:
                0 8px 28px
                rgba(27, 94, 64, 0.07);

            animation:
                cardAppear 0.55s ease-out;
        }


        /* =========================================
           SUCCESS ICON
        ========================================= */

        .success-icon {

            width: 72px;

            height: 72px;

            margin:
                0 auto 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #18ad68;

            color: #ffffff;

            border-radius: 50%;

            font-size: 35px;

            font-weight: 700;

            box-shadow:
                0 7px 18px
                rgba(24, 173, 104, 0.25);

            animation:
                successPop 0.75s
                cubic-bezier(0.175, 0.885, 0.32, 1.275)
                both;
        }


        /* =========================================
           CHECK MARK
        ========================================= */

        .check {

            display: block;

            animation:
                checkAppear 0.4s
                0.35s ease-out both;
        }


        /* =========================================
           HEADING
        ========================================= */

        h1 {

            margin: 0;

            font-size: 24px;

            font-weight: 700;

            color: #263238;

            animation:
                textAppear 0.5s
                0.15s ease-out both;
        }


        .message {

            margin:
                10px 0 23px;

            color: #7b8581;

            font-size: 12px;

            line-height: 1.6;

            animation:
                textAppear 0.5s
                0.22s ease-out both;
        }


        /* =========================================
           ORDER INFO
        ========================================= */

        .order-info {

            background: #f8fbf9;

            border:
                1px solid #e2ebe6;

            border-radius: 10px;

            padding:
                12px 15px;

            text-align: left;

            animation:
                textAppear 0.5s
                0.3s ease-out both;
        }


        .info-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 8px 0;

            font-size: 12px;
        }


        .info-row + .info-row {

            border-top:
                1px solid #e8efeb;
        }


        .info-label {

            color: #7b8581;
        }


        .info-value {

            color: #34423c;

            font-weight: 700;

            text-align: right;
        }


        /* =========================================
           BUTTONS
        ========================================= */

        .buttons {

            margin-top: 22px;

            animation:
                textAppear 0.5s
                0.38s ease-out both;
        }


        .button {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            min-height: 44px;

            padding:
                0 20px;

            background: #18ad68;

            color: #ffffff;

            text-decoration: none;

            border-radius: 8px;

            font-size: 12px;

            font-weight: 700;

            box-shadow:
                0 4px 10px
                rgba(24, 173, 104, 0.15);

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .button:hover {

            background: #13965a;

            color: #ffffff;

            transform: translateY(-1px);
        }


        .secondary-button {

            margin-top: 9px;

            background: #e8f7ef;

            color: #15955a;

            border:
                1px solid #cfe9da;

            box-shadow: none;
        }


        .secondary-button:hover {

            background: #dcefe5;

            color: #12844f;
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes successPop {

            0% {

                opacity: 0;

                transform:
                    scale(0.2)
                    rotate(-15deg);
            }

            55% {

                opacity: 1;

                transform:
                    scale(1.16)
                    rotate(3deg);
            }

            75% {

                transform:
                    scale(0.94)
                    rotate(-1deg);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);
            }

        }


        @keyframes checkAppear {

            0% {

                opacity: 0;

                transform:
                    scale(0.3);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1);
            }

        }


        @keyframes cardAppear {

            0% {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        @keyframes textAppear {

            0% {

                opacity: 0;

                transform:
                    translateY(6px);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {

                padding: 14px;
            }


            .success-card {

                padding:
                    28px 18px 24px;

                border-radius: 14px;
            }


            .success-icon {

                width: 68px;

                height: 68px;

                font-size: 33px;

                margin-bottom: 15px;
            }


            h1 {

                font-size: 21px;
            }


            .message {

                font-size: 11px;

                margin-bottom: 20px;
            }


            .order-info {

                padding:
                    10px 13px;
            }


            .info-row {

                font-size: 11px;

                padding: 7px 0;
            }


            .button {

                min-height: 43px;

                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <div class="success-card">


        <!-- =========================================
             SUCCESS ICON
        ========================================= -->

        <div class="success-icon">

            <span class="check">
                ✓
            </span>

        </div>


        <!-- =========================================
             HEADING
        ========================================= -->

        <h1>
            Order Placed Successfully
        </h1>


        <div class="message">

            Thank you for your order.
            Your order has been sent to the cafe.

        </div>


        <!-- =========================================
             ORDER INFORMATION
        ========================================= -->

        <div class="order-info">


            <div class="info-row">

                <span class="info-label">
                    Order Number
                </span>

                <span class="info-value">
                    #{{ order.id }}
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Table
                </span>

                <span class="info-value">
                    {{ table.table_number }}
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Total Amount
                </span>

                <span class="info-value">
                    ₹{{ order.total_amount }}
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Status
                </span>

                <span class="info-value">
                    {{ order.get_status_display }}
                </span>

            </div>


        </div>


        <!-- =========================================
             BUTTONS
        ========================================= -->

        <div class="buttons">


            <a
                href="{% url 'order_status' table.table_number order.id %}"
                class="button"
            >
                Track Order Status
            </a>


            <a
                href="{% url 'menu' table.table_number %}"
                class="button secondary-button"
            >
                Back to Menu
            </a>


        </div>


    </div>


    <!-- =========================================
         SUCCESS VIBRATION
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                /*
                 * Short double vibration
                 *
                 * 100ms vibrate
                 * 70ms pause
                 * 100ms vibrate
                 */

                if (
                    "vibrate" in navigator
                ) {

                    setTimeout(
                        function () {

                            navigator.vibrate(
                                [100, 70, 100]
                            );

                        },
                        350
                    );

                }

            }
        );

    </script>


</body>

</html>
